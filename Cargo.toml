[workspace]
resolver = "3"
members = ["crates/ldapm-core", "crates/ldapm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/xezpeleta/ldapm"
publish = false

[workspace.dependencies]
ldapm-core = { path = "crates/ldapm-core" }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
zeroize = "1"

[profile.release]
strip = true
lto = "thin"
